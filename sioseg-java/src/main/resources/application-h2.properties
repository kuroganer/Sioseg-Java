# Database (H2 - Development mode)
spring.datasource.url=jdbc:h2:mem:sioseg;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.sioseg=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=WARN
