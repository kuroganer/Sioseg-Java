<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="../layout :: layout">
<head>
    <title>Painel Técnico - Sioseg</title>
</head>
<body>
<div th:fragment="content">
    <h2>Painel do Técnico</h2>
    <p>Lista de OS do dia:</p>
    <ul>
        <li th:each="o : ${ordens}">
            <a th:href="@{'/os/' + ${o.idOs}}" th:text="${o.cliente != null ? (o.cliente.nomeCli != null ? o.cliente.nomeCli : o.cliente.razaoSocial) : '—'} + ' — ' + ${o.dataAgendamento}"></a>
        </li>
    </ul>
</div>
</body>
</html>
