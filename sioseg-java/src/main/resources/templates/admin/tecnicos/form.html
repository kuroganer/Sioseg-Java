<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Novo Técnico - SIOSeG</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="form-container">
            <div class="form-sidebar">
                <div class="sidebar-header">
                    <h2 class="sidebar-title">Novo Técnico</h2>
                </div>
                <div class="sidebar-footer">
                    <p>Preencha todos os campos obrigatórios</p>
                </div>
            </div>
            
            <div class="form-main">
                <form>
                    <div class="form-section">
                        <h3 class="form-section-title">Dados Pessoais</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nomeTec">Nome Completo *</label>
                                <input type="text" id="nomeTec" name="nomeTec" required />
                            </div>
                            <div class="form-group">
                                <label for="cpfTec">CPF *</label>
                                <input type="text" id="cpfTec" name="cpfTec" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="rgTec">RG</label>
                                <input type="text" id="rgTec" name="rgTec" />
                            </div>
                            <div class="form-group">
                                <label for="dataNascimentoTec">Data de Nascimento</label>
                                <input type="date" id="dataNascimentoTec" name="dataNascimentoTec" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="form-section-title">Contato</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="emailTec">Email *</label>
                                <input type="email" id="emailTec" name="emailTec" required />
                            </div>
                            <div class="form-group">
                                <label for="telPessoal">Telefone Pessoal *</label>
                                <input type="tel" id="telPessoal" name="telPessoal" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="telEmpresa">Telefone Empresa</label>
                                <input type="tel" id="telEmpresa" name="telEmpresa" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="form-section-title">Acesso ao Sistema</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="senha">Senha *</label>
                                <input type="password" id="senha" name="senha" required />
                            </div>
                            <div class="form-group">
                                <label for="confirmarSenha">Confirmar Senha *</label>
                                <input type="password" id="confirmarSenha" name="confirmarSenha" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="status">Status</label>
                                <select id="status" name="status">
                                    <option value="ativo">Ativo</option>
                                    <option value="inativo">Inativo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit">Cadastrar Técnico</button>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
