<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <th:block th:fragment="css">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    </th:block>
</head>
<body>
    <th:block th:fragment="content">
        <div class="page-header">
            <h1>Performance dos Técnicos</h1>
            <a href="/admin/relatorios" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>
        
        <div class="performance-container">
            <div class="performance-card">
                <h3>Ranking de Técnicos</h3>
                <div class="ranking-list">
                    <div class="ranking-item">
                        <span class="rank">#1</span>
                        <span class="name">João Silva</span>
                        <span class="score">4.8</span>
                    </div>
                    <div class="ranking-item">
                        <span class="rank">#2</span>
                        <span class="name">Maria Santos</span>
                        <span class="score">4.6</span>
                    </div>
                    <div class="ranking-item">
                        <span class="rank">#3</span>
                        <span class="name">Pedro Costa</span>
                        <span class="score">4.4</span>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
