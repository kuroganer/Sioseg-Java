<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <th:block th:fragment="css">
        <link rel="stylesheet" th:href="@{/css/forms.css}" />
        <link rel="stylesheet" th:href="@{/css/tables.css}" />
    </th:block>
</head>
<body>
    <th:block th:fragment="content">
        <div class="form-system">
            <div class="form-system__header">
                <h1 class="form-system__title">Pesquisar Pedidos</h1>
                <a href="/admin/pedidos" class="form-system__btn form-system__btn--secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>
            
            <form action="/admin/pedidos/search" method="post" class="form-system__form">
                <div class="form-system__row">
                    <div class="form-system__group">
                        <label for="tipo" class="form-system__label">Pesquisar por:</label>
                        <select id="tipo" name="tipo" class="form-system__input" required>
                            <option value="status" th:selected="${tipo == 'status'}">Status</option>
                            <option value="produto" th:selected="${tipo == 'produto'}">Nome do Produto</option>
                        </select>
                    </div>
                    
                    <div class="form-system__group">
                        <label for="termo" class="form-system__label">Termo de busca:</label>
                        <input type="text" id="termo" name="termo" class="form-system__input" 
                               th:value="${termo}" placeholder="Digite o termo de busca" required />
                    </div>
                </div>
                
                <div class="form-system__actions">
                    <button type="submit" class="form-system__btn form-system__btn--primary">
                        <i class="fas fa-search"></i> Pesquisar
                    </button>
                </div>
            </form>
            
            <!-- Resultados da pesquisa -->
            <div th:if="${pedidos != null}" class="table-system" style="margin-top: 30px;">
                <div class="table-system__header">
                    <h2 class="table-system__title">Resultados da Pesquisa</h2>
                    <p th:if="${pedidos.totalElements > 0}" class="table-system__info">
                        Encontrados <span th:text="${pedidos.totalElements}">0</span> pedidos
                    </p>
                    <p th:if="${pedidos.totalElements == 0}" class="table-system__info">
                        Nenhum pedido encontrado para os critérios informados.
                    </p>
                </div>
                
                <div th:if="${pedidos.totalElements > 0}" class="table-system__wrapper">
                    <table class="table-system__table">
                        <thead>
                            <tr>
                                <th class="table-system__header-cell">ID</th>
                                <th class="table-system__header-cell">Produto</th>
                                <th class="table-system__header-cell">Quantidade</th>
                                <th class="table-system__header-cell">Status</th>
                                <th class="table-system__header-cell">Data Pedido</th>
                                <th class="table-system__header-cell">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pedido : ${pedidos.content}" class="table-system__row">
                                <td class="table-system__cell" th:text="${pedido.idPed}">1</td>
                                <td class="table-system__cell" th:text="${pedido.produto?.nome ?: '—'}">Produto</td>
                                <td class="table-system__cell table-system__cell--numeric" th:text="${pedido.qtde}">10</td>
                                <td class="table-system__cell">
                                    <span class="table-system__badge" 
                                          th:classappend="${pedido.status == 'entregue'} ? 'table-system__badge--success' : 
                                                         (${pedido.status == 'pendente'} ? 'table-system__badge--warning' : 'table-system__badge--info')"
                                          th:text="${pedido.status}">Pendente</span>
                                </td>
                                <td class="table-system__cell" th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}">01/01/2024</td>
                                <td class="table-system__cell">
                                    <a th:href="@{/admin/pedidos/edit/{id}(id=${pedido.idPed})}" 
                                       class="table-system__btn table-system__btn--primary">
                                        <i class="fas fa-edit"></i> Editar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Paginação dos resultados -->
                <div th:if="${pedidos.totalPages > 1}" style="margin-top: 20px; text-align: center;">
                    <div style="display: inline-flex; gap: 5px;">
                        <a th:if="${pedidos.hasPrevious()}" 
                           th:href="@{/admin/pedidos/search(page=${pedidos.number - 1}, tipo=${tipo}, termo=${termo})}"
                           class="table-system__btn table-system__btn--secondary">Anterior</a>
                        
                        <span style="padding: 8px 12px; background: #f8f9fa; border-radius: 4px;">
                            Página <span th:text="${pedidos.number + 1}">1</span> de <span th:text="${pedidos.totalPages}">1</span>
                        </span>
                        
                        <a th:if="${pedidos.hasNext()}" 
                           th:href="@{/admin/pedidos/search(page=${pedidos.number + 1}, tipo=${tipo}, termo=${termo})}"
                           class="table-system__btn table-system__btn--secondary">Próxima</a>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
