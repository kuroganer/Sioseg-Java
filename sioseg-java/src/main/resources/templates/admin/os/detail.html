<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="../../layout :: layout">
<head>
    <title>OS Detail - Sioseg</title>
</head>
<body>
<div th:fragment="content">
    <h2>Ordem de Serviço</h2>
    <div th:if="${os}">
        <p><strong>ID:</strong> <span th:text="${os.idOs}"></span></p>
        <p><strong>Cliente:</strong> <span th:text="${os.cliente != null ? (os.cliente.nomeCli != null ? os.cliente.nomeCli : os.cliente.razaoSocial) : '—'}"></span></p>
        <p><strong>Técnico:</strong> <span th:text="${os.tecnico != null ? os.tecnico.nomeTec : '—'}"></span></p>
        <p><strong>Data Agendamento:</strong> <span th:text="${os.dataAgendamento}"></span></p>
        <p><strong>Status:</strong> <span th:text="${os.status}"></span></p>

        <h3>Materiais Usados</h3>
        <table>
            <thead><tr><th>Produto</th><th>Quantidade</th></tr></thead>
            <tbody>
            <tr th:each="m : ${materiais}">
                <td th:text="${m.produto != null ? m.produto.nome : '—'}"></td>
                <td th:text="${m.qtdUsada}"></td>
            </tr>
            </tbody>
        </table>

        <form th:action="@{'/os/' + ${os.idOs} + '/encerrar'}" method="post">
            <label><input type="checkbox" name="removerMateriais" value="true"/> Estornar materiais</label>
            <button type="submit">Encerrar OS</button>
        </form>
    </div>
    <div th:if="${error}">
        <p th:text="${error}" style="color:red"></p>
    </div>
</div>
</body>
</html>
