<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIOSeG</title>
    <link rel="stylesheet" th:href="@{/css/globals.css}" />
    <link rel="stylesheet" th:href="@{/css/forms.css}" />
    <link rel="icon" th:href="@{/img/icone.png}" type="image/png" />
    <style>
        body {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-title {
            color: #1E3A8A;
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        
        .login-subtitle {
            color: #6B7280;
            font-size: 14px;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #1E3A8A;
        }
        
        .btn-login {
            width: 100%;
            background: #1E3A8A;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .btn-login:hover {
            background: #1E40AF;
        }
        
        .error-message {
            background: #FEE2E2;
            color: #DC2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .test-credentials {
            margin-top: 20px;
            padding: 15px;
            background: #F3F4F6;
            border-radius: 8px;
            font-size: 12px;
            color: #6B7280;
        }
        
        .test-credentials strong {
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">SIOSeG</h1>
            <p class="login-subtitle">Sistema Integrado de OS e Gestão</p>
        </div>
        
        <div th:if="${param.error}" class="error-message">
            Usuário ou senha inválidos
        </div>
        
        <div th:if="${param.logout}" class="error-message" style="background: #D1FAE5; color: #065F46;">
            Logout realizado com sucesso
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email_usu" class="form-label">Email</label>
                <input type="email" id="email_usu" name="email_usu" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" name="senha" class="form-input" required>
            </div>
            
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        

    </div>
</body>
</html>
