<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Novo Usuário - SIOSeG</title>
    <th:block th:fragment="css">
        <link rel="stylesheet" th:href="@{/css/forms.css}" />
    </th:block>
</head>
<body>
    <th:block th:fragment="content">
        <div class="form-container">
            <div class="form-sidebar">
                <div class="sidebar-header">
                    <h2 class="sidebar-title">Novo Usuário</h2>
                </div>
                <div class="sidebar-footer">
                    <p>Preencha todos os campos obrigatórios</p>
                </div>
            </div>
            
            <div class="form-main">
                <form>
                    <div class="form-section">
                        <h3 class="form-section-title">Dados Pessoais</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nomeUsu">Nome Completo *</label>
                                <input type="text" id="nomeUsu" name="nomeUsu" required />
                            </div>
                            <div class="form-group">
                                <label for="cpfUsu">CPF *</label>
                                <input type="text" id="cpfUsu" name="cpfUsu" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="rgUsu">RG</label>
                                <input type="text" id="rgUsu" name="rgUsu" />
                            </div>
                            <div class="form-group">
                                <label for="dataNascimentoUsu">Data de Nascimento</label>
                                <input type="date" id="dataNascimentoUsu" name="dataNascimentoUsu" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="form-section-title">Contato</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="emailUsu">Email *</label>
                                <input type="email" id="emailUsu" name="emailUsu" required />
                            </div>
                            <div class="form-group">
                                <label for="tel1Usu">Telefone Principal *</label>
                                <input type="tel" id="tel1Usu" name="tel1Usu" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tel2Usu">Telefone Secundário</label>
                                <input type="tel" id="tel2Usu" name="tel2Usu" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="form-section-title">Acesso ao Sistema</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="perfil">Perfil *</label>
                                <select id="perfil" name="perfil" required>
                                    <option value="">Selecione</option>
                                    <option value="admin">Administrador</option>
                                    <option value="funcionario">Funcionário</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="status">Status</label>
                                <select id="status" name="status">
                                    <option value="ativo">Ativo</option>
                                    <option value="inativo">Inativo</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="senha">Senha *</label>
                                <input type="password" id="senha" name="senha" required />
                            </div>
                            <div class="form-group">
                                <label for="confirmarSenha">Confirmar Senha *</label>
                                <input type="password" id="confirmarSenha" name="confirmarSenha" required />
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit">Cadastrar Usuário</button>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
