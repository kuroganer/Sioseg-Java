<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Pesquisar Usuários - SIOSeG</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="form-system">
            <div class="form-system__header">
                <h1 class="form-system__title">Pesquisar Usuários</h1>
                <a href="/admin/users" class="form-system__btn form-system__btn--secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>
            
            <form action="/admin/users/search" method="get" class="form-system__form">
                <div class="form-system__row">
                    <div class="form-system__group">
                        <label for="nome" class="form-system__label">Nome:</label>
                        <input type="text" id="nome" name="nome" class="form-system__input" 
                               th:value="${searchTerm}" placeholder="Digite o nome do usuário" />
                    </div>
                </div>
                
                <div class="form-system__actions">
                    <button type="submit" class="form-system__btn form-system__btn--primary">
                        <i class="fas fa-search"></i> Pesquisar
                    </button>
                </div>
            </form>
            
            <!-- Resultados da pesquisa -->
            <div th:if="${usuarios != null}" class="table-system" style="margin-top: 30px;">
                <div class="table-system__header">
                    <h2 class="table-system__title">Resultados da Pesquisa</h2>
                    <p th:if="${#lists.size(usuarios) > 0}" class="table-system__info">
                        Encontrados <span th:text="${#lists.size(usuarios)}">0</span> usuários
                    </p>
                    <p th:if="${#lists.size(usuarios) == 0}" class="table-system__info">
                        Nenhum usuário encontrado para os critérios informados.
                    </p>
                </div>
                
                <div th:if="${#lists.size(usuarios) > 0}" class="table-system__wrapper">
                    <table class="table-system__table">
                        <thead>
                            <tr>
                                <th class="table-system__header-cell">Nome</th>
                                <th class="table-system__header-cell">CPF</th>
                                <th class="table-system__header-cell">Email</th>
                                <th class="table-system__header-cell">Perfil</th>
                                <th class="table-system__header-cell">Status</th>
                                <th class="table-system__header-cell">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}" class="table-system__row">
                                <td class="table-system__cell" th:text="${usuario.nomeUsu ?: '—'}">Nome</td>
                                <td class="table-system__cell" th:text="${usuario.cpfUsu ?: '—'}">CPF</td>
                                <td class="table-system__cell" th:text="${usuario.emailUsu ?: '—'}">Email</td>
                                <td class="table-system__cell" th:text="${usuario.perfil ?: '—'}">Perfil</td>
                                <td class="table-system__cell">
                                    <span class="table-system__badge" 
                                          th:classappend="${usuario.status == 'ativo'} ? 'table-system__badge--success' : 'table-system__badge--error'"
                                          th:text="${usuario.status}">Ativo</span>
                                </td>
                                <td class="table-system__cell">
                                    <form th:action="@{/admin/users/changeStatus}" method="post" style="display: inline;">
                                        <input type="hidden" name="id" th:value="${usuario.idUsu}" />
                                        <input type="hidden" name="status" th:value="${usuario.status == 'ativo' ? 'inativo' : 'ativo'}" />
                                        <button type="submit" class="table-system__btn table-system__btn--warning">
                                            <i class="fas fa-toggle-on" th:if="${usuario.status == 'ativo'}"></i>
                                            <i class="fas fa-toggle-off" th:if="${usuario.status != 'ativo'}"></i>
                                            <span th:text="${usuario.status == 'ativo' ? 'Desativar' : 'Ativar'}">Toggle</span>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
