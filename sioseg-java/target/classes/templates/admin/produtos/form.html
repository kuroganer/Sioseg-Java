<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Novo Produto - SIOSeG</title>
</head>
<body>
    <th:block th:fragment="content">
        <div class="form-container">
            <div class="form-sidebar">
                <div class="sidebar-header">
                    <h2 class="sidebar-title">Novo Produto</h2>
                </div>
                <div class="sidebar-footer">
                    <p>Preencha todos os campos obrigatórios</p>
                </div>
            </div>
            
            <div class="form-main">
                <form>
                    <div class="form-section">
                        <h3 class="form-section-title">Informações do Produto</h3>
                        <div class="form-row">
                            <div class="form-group flex-2">
                                <label for="nome">Nome do Produto *</label>
                                <input type="text" id="nome" name="nome" required />
                            </div>
                            <div class="form-group">
                                <label for="qtde">Quantidade *</label>
                                <input type="number" id="qtde" name="qtde" min="0" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="marca">Marca</label>
                                <input type="text" id="marca" name="marca" />
                            </div>
                            <div class="form-group">
                                <label for="modelo">Modelo</label>
                                <input type="text" id="modelo" name="modelo" />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="descricao">Descrição</label>
                                <textarea id="descricao" name="descricao" rows="4"></textarea>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="form-section-title">Status</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="status">Status</label>
                                <select id="status" name="status">
                                    <option value="ativo">Ativo</option>
                                    <option value="inativo">Inativo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit">Cadastrar Produto</button>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
